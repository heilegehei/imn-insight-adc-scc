<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" fill="none">
  <title>Inflammation, immunity, and nutrition</title>
  <desc>Symbolic inflammatory cell, antibody-bearing shield, and nutrient leaves connected across three laboratory domains. Decorative, not a biological pathway diagram.</desc>
  <defs>
    <linearGradient id="cell" x1="95" y1="55" x2="192" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCEB0" stop-opacity=".56"/><stop offset=".5" stop-color="#F27D68" stop-opacity=".24"/><stop offset="1" stop-color="#D94360" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="warmEdge" x1="90" y1="55" x2="202" y2="195" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE9CE"/><stop offset=".55" stop-color="#FF9D78"/><stop offset="1" stop-color="#E37187"/>
    </linearGradient>
    <linearGradient id="shield" x1="368" y1="34" x2="473" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BCEFFC" stop-opacity=".42"/><stop offset=".48" stop-color="#67BCD7" stop-opacity=".2"/><stop offset="1" stop-color="#245D86" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="coolEdge" x1="363" y1="41" x2="469" y2="198" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2FBFF"/><stop offset=".55" stop-color="#85D8E8"/><stop offset="1" stop-color="#549FC5"/>
    </linearGradient>
    <linearGradient id="leaf" x1="660" y1="58" x2="751" y2="178" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DBF7C7" stop-opacity=".53"/><stop offset=".45" stop-color="#A0DCA7" stop-opacity=".25"/><stop offset="1" stop-color="#327F69" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="greenEdge" x1="648" y1="58" x2="757" y2="197" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EDF8D5"/><stop offset=".55" stop-color="#AEDFB5"/><stop offset="1" stop-color="#6CB99B"/>
    </linearGradient>
    <linearGradient id="connection" x1="205" y1="135" x2="635" y2="135" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB294" stop-opacity=".42"/><stop offset=".5" stop-color="#AFE7F2" stop-opacity=".56"/><stop offset="1" stop-color="#B3DFAE" stop-opacity=".42"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-160%" width="300%" height="420%"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="edgeGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5"/></filter>
  </defs>
  <g opacity=".5" filter="url(#softGlow)">
    <ellipse cx="140" cy="139" rx="63" ry="69" fill="#C9604E" fill-opacity=".48"/>
    <ellipse cx="420" cy="131" rx="61" ry="82" fill="#529DBA" fill-opacity=".48"/>
    <ellipse cx="700" cy="140" rx="64" ry="69" fill="#6AAB77" fill-opacity=".40"/>
  </g>
  <path d="M207 134 C268 134 284 111 357 111 M483 111 C556 111 570 134 633 134" stroke="url(#connection)" stroke-width="1.4"/>
  <path d="M204 163 C301 221 539 221 636 163" stroke="url(#connection)" stroke-opacity=".33" stroke-width="1"/>
  <g fill="#C0DAE2"><circle cx="280" cy="123" r="2.5" fill-opacity=".66"/><circle cx="560" cy="123" r="2.5" fill-opacity=".66"/><circle cx="420" cy="206" r="2" fill-opacity=".33"/></g>
  <!-- A stylised inflammatory cell with a lobed membrane and intracellular granules. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M144 60 C157 53 165 65 173 66 C188 65 189 82 198 89 C211 96 207 110 211 121 C219 136 207 148 207 159 C206 173 189 177 183 187 C176 199 159 193 149 198 C135 206 125 194 115 194 C100 194 97 180 86 176 C74 171 80 155 73 145 C65 134 74 122 73 112 C70 96 88 92 90 81 C94 67 112 74 120 66 C127 58 134 65 144 60Z" fill="url(#cell)" stroke="url(#warmEdge)" stroke-width="2.1"/>
    <path d="M119 84 C98 92 86 112 88 132 M173 178 C187 169 193 155 193 145" stroke="#FFD3BC" stroke-opacity=".5" stroke-width="1.2"/>
    <path d="M118 108 C126 94 144 101 147 113 C154 123 171 117 173 132 C175 146 159 153 150 146 C138 139 132 157 119 149 C104 141 109 124 118 108Z" fill="#F1988C" fill-opacity=".36" stroke="#FFC6AF" stroke-opacity=".85" stroke-width="1.6"/>
    <g fill="#FFD4BA" fill-opacity=".72"><circle cx="104" cy="113" r="2.6"/><circle cx="130" cy="173" r="2.6"/><circle cx="163" cy="93" r="2.3"/><circle cx="185" cy="124" r="2.5"/><circle cx="101" cy="150" r="2"/><circle cx="166" cy="165" r="2"/></g>
    <path d="M72 91 L63 86 M88 62 L84 53 M183 62 L190 54 M217 155 L227 158 M72 181 L65 187" stroke="#F5AD96" stroke-opacity=".66" stroke-width="1.5"/>
    <circle cx="58" cy="111" r="2.3" fill="#FFC9B2" fill-opacity=".55"/><circle cx="215" cy="82" r="2" fill="#FFC9B2" fill-opacity=".5"/>
  </g>
  <!-- A protective shield containing an antibody-shaped Y. -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M420 36 C439 49 460 57 480 61 V111 C480 155 456 182 420 205 C384 182 360 155 360 111 V61 C381 57 402 49 420 36Z" fill="url(#shield)" stroke="url(#coolEdge)" stroke-width="2.2"/>
    <path d="M420 49 C436 60 455 66 469 70 V111 C469 147 451 171 420 192 C389 171 371 147 371 111 V70 C387 66 404 60 420 49Z" stroke="#BDE8F4" stroke-opacity=".22" stroke-width="1"/>
    <path d="M420 153 V115 L392 88 M420 115 L448 88" stroke="#B4EBF4" stroke-opacity=".45" stroke-width="12" filter="url(#edgeGlow)"/>
    <path d="M416 156 V117 L390 92 M424 156 V117 L450 92 M389 82 L398 83 L398 94 M451 82 L442 83 L442 94" stroke="#D4F4FA" stroke-width="3.7"/>
    <circle cx="420" cy="173" r="2.5" fill="#AEDEE9" fill-opacity=".72"/>
  </g>
  <!-- Nutrient leaves and a small molecular motif, used as a nutrition symbol. -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M700 151 C677 112 688 75 747 61 C755 105 742 143 700 151Z" fill="url(#leaf)" stroke="url(#greenEdge)" stroke-width="2.2"/>
    <path d="M697 160 C663 164 641 144 641 103 C679 103 700 124 697 160Z" fill="url(#leaf)" stroke="url(#greenEdge)" stroke-width="1.9"/>
    <path d="M696 191 C695 167 697 144 714 115 L735 79 M697 160 L657 119" stroke="#DBEFCE" stroke-width="2.7"/>
    <path d="M714 114 L716 88 M714 114 L739 106 M706 131 L732 123 M676 140 L674 121" stroke="#C3E2BF" stroke-opacity=".7" stroke-width="1.3"/>
    <path d="M756 159 L769 167 V182 L756 190 L743 182 V167Z M769 167 L780 161 M743 182 L732 188" stroke="#B4D7BA" stroke-opacity=".58" stroke-width="1.2"/>
    <g fill="#C7E9CA"><circle cx="756" cy="159" r="2.8"/><circle cx="769" cy="182" r="2.7"/><circle cx="743" cy="182" r="2.5"/><circle cx="780" cy="161" r="2" fill-opacity=".64"/></g>
  </g>
</svg>
